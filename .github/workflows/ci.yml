name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Front-end
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Executar testes
        run: npm test

  backend:
    name: Backend e cobertura
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Executar testes e gerar JAR
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B verify

      - name: Publicar relatório JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cobertura-jacoco
          path: backend/target/site/jacoco
          if-no-files-found: warn

      - name: Publicar JAR
        uses: actions/upload-artifact@v4
        with:
          name: api-jar
          path: backend/target/cafe-na-mao-api-0.1.0.jar

  contrato:
    name: Contrato Postman/Newman
    needs: backend
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Baixar JAR
        uses: actions/download-artifact@v4
        with:
          name: api-jar
          path: backend/target

      - name: Executar contrato contra a API
        working-directory: backend
        run: |
          java -jar target/cafe-na-mao-api-0.1.0.jar > api-ci.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          pronto=0
          for tentativa in $(seq 1 40); do
            if curl --fail --silent http://localhost:8080/api/bebidas > /dev/null; then
              pronto=1
              break
            fi
            sleep 1
          done

          if [ "$pronto" != "1" ]; then
            echo "A API não ficou disponível a tempo."
            cat api-ci.log
            exit 1
          fi

          npx --yes newman run postman/CafeNaMao.postman_collection.json \
            -e postman/CafeNaMao.postman_environment.json \
            --reporters cli --color off
