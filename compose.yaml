name: cafe-na-mao

services:
  banco:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-cafenamao}
      POSTGRES_USER: ${DB_USER:-cafenamao}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-cafenamao}
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - dados-cafenamao:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-cafenamao} -d ${DB_NAME:-cafenamao}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  testes-backend:
    profiles: ["testes"]
    build:
      context: ./backend
    command: ["mvn", "-B", "verify"]

  testes-frontend:
    profiles: ["testes"]
    image: node:24-alpine
    working_dir: /app
    volumes:
      - .:/app:ro
    command: ["npm", "test"]

volumes:
  dados-cafenamao:
